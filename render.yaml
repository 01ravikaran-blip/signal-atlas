services:
  # 1. Web Service: Dashboard, API & Readiness Endpoints
  - type: web
    name: signal-atlas-247
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health/readiness
    envVars:
      - key: PORT
        value: "5050"
      - key: NODE_ENV
        value: "production"
      - key: RENDER
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: EMERGENCY_PAUSE
        value: "false"
      - key: PUBLISH_INTERVAL_MINUTES
        value: "5"
      - key: CRYPTO_DEFI_PERCENT
        value: "50"
      - key: AI_WEB3_PERCENT
        value: "25"
      - key: STOCKS_MACRO_PERCENT
        value: "25"
      - key: MIN_CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: LLM_PROVIDER
        value: "groq"
      - key: AI_PROVIDER
        value: "groq"
      - key: LLM_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BLUESKY_HANDLE
        sync: false
      - key: BLUESKY_APP_PASSWORD
        sync: false
      - key: BLUESKY_SERVICE_URL
        value: "https://bsky.social"
      - key: FARCASTER_NEYNAR_API_KEY
        sync: false
      - key: FARCASTER_SIGNER_UUID
        sync: false
      - key: FARCASTER_HANDLE
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # 2. Persistent Unattended Background Worker
  - type: worker
    name: signal-atlas-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: npm run worker
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: RENDER
        value: "true"
      - key: DEMO_MODE
        value: "false"
      - key: EMERGENCY_PAUSE
        value: "false"
      - key: PUBLISH_INTERVAL_MINUTES
        value: "5"
      - key: LLM_PROVIDER
        value: "groq"
      - key: AI_PROVIDER
        value: "groq"
      - key: LLM_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BLUESKY_HANDLE
        sync: false
      - key: BLUESKY_APP_PASSWORD
        sync: false
      - key: FARCASTER_NEYNAR_API_KEY
        sync: false
      - key: FARCASTER_SIGNER_UUID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false


